// ============================================================
//  SECTIA 16 - jb.sectia16.ro | Jailbreak Counter-Strike 1.6
//  amxx.cfg - configurare AMX Mod X 1.10 (versiune CURATA)
//
//  FARA mesaje generice: amx_scrollmsg si amx_imessage sunt goale
//  (pluginurile imessage.amxx / scrollmsg.amxx sunt si ele dezactivate
//  in plugins.ini). Nimic de tipul "This server is using AMX Mod X".
// ============================================================
echo Executing AMX Mod X Configuration File [SECTIA 16]

// Accesul default pentru jucatorii non-admin (vezi users.ini)
amx_default_access "z"

// Numele campului setinfo in care clientul isi salveaza parola
amx_password_field "_pw"

// Modul de logare a adminilor
// 0 - dezactivat, 1 - normal, 2 - kick pentru cei lipsa din lista
amx_mode 1

// Activitatea adminilor (2 = cu nume vizibil)
amx_show_activity 2

// ----- FARA MESAJE GENERICE -----
amx_scrollmsg ""
amx_freq_imessage 0

// Timpuri de ban pentru meniul amx_banmenu (0 = permanent)
amx_plmenu_bantimes 0 5 10 15 30 45 60

// Banul temporar maxim (minute) pentru adminii cu ADMIN_BAN_TEMP
amx_tempban_maxtime 4320

// Daunele pentru meniul amx_slapmenu
amx_plmenu_slapdmg 0 1 5

// Protectia anti-flood pe chat (secunde)
amx_flood_time 0.75

// Rezervarea sloturilor (vezi adminslots.amxx)
amx_reservation 0

// Limba serverului - pluginurile SECTIA 16 sunt 100% romana
amx_client_languages 0
amx_language "ro"
