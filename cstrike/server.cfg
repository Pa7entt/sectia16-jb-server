// ============================================================
//  SECTIA 16 - jb.sectia16.ro | Jailbreak Counter-Strike 1.6
//  server.cfg - identitate, retea, FastDL (ReHLDS)
// ============================================================

hostname "SECTIA 16 | JB.SECTIA16.RO | Jailbreak Romania"
sv_password ""

// ----- SECURITATE (SCHIMBA IMEDIAT!) -----
rcon_password "SCHIMBA_MA_ACUM_rcon_sectia16"

// ----- Retea / Tickrate (ReHLDS) -----
sys_ticrate 1000
sv_maxrate 100000
sv_minrate 25000
sv_lan 0
sv_region 255
sv_aim 0
sv_cheats 0
sv_allowdownload 1
sv_allowupload 0

// ----- FastDL -----
// Pune fisierele cstrike pe un web server si seteaza URL-ul:
// ex: http://fastdl.sectia16.ro/cstrike
sv_downloadurl ""
sv_sendvelocity 1

// ----- Joc / JB -----
mp_timelimit 30
mp_maxrounds 0
mp_freezetime 3
mp_roundtime 9
mp_startmoney 800
mp_buytime 0.25
mp_friendlyfire 0
mp_autoteambalance 0
mp_limitteams 10
mp_autokick 0
mp_tkpunish 0
mp_fadetoblack 0
mp_forcecamera 0
mp_falldamage 1
mp_chattime 5
mp_playerid 0
allow_spectators 1
pausable 0
decalfrequency 60
edgefriction 2

// ----- Server side -----
log on
mp_logdetail 1
sv_logbans 1
sv_logecho 0
sv_logfile 1

// AMXX
amx_debug 1
amx_ptb disabled

// ----- Fizica & miscare (ReGameDLL + pluginuri) -----
exec game.cfg

mapcyclefile "mapcycle.txt"
servercfgfile "server.cfg"
