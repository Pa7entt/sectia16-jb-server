// ============================================================
//  SECTIA 16 - jb.sectia16.ro
//  game.cfg - ReGameDLL: bhop uncapped, surf & fizica
//  (executat automat de server.cfg la fiecare harta)
// ============================================================

// ----- BHOP UNCAPPED -----
// sv_enablebunnyhopping elimina clamp-ul hardcodat de 320 u/s la saritura
// (echivalentul a pm_fuser2 resetat + limita de viteza dezactivata).
// sectia16_bhop.amxx reaplica automat valorile la fiecare runda noua.
sv_enablebunnyhopping 1

// Auto-bhop nativ ReGameDLL (rezerva pe langa hookchain-ul RG_PM_Move).
sv_autobunnyhopping 1

// ----- SURF & MISCARE -----
// sv_airaccelerate 100 = tranzitii curate pe rampe, fara lipire si fara
// pierdere de moment; combinat cu pm_fuser2 = 0.0 din sectia16_bhop.amxx
// rezulta surf continuu, constant, fara frana ascunsa.
sv_airaccelerate 100
sv_maxvelocity 3500
sv_stopspeed 100
sv_friction 4
sv_bounce 1

// ----- ReGameDLL - reguli de runda JB -----
mp_freezetime 3
mp_roundtime 9
mp_round_infinite 0
mp_itemstaytime 300
mp_forcechasecam 0
mp_footsteps 1

// ----- Cvar-uri pluginuri SECTIA 16 -----
s16_bhop 1
s16_bhop_auto 1
s16_whistle_freeze 3
s16_credits_kill 25
s16_credits_minute 5
s16_cost_pila 500
s16_cost_manea 750
s16_cost_palinca 400
s16_cost_manta 900
